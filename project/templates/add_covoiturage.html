{% extends 'base.html' %}

{% block content %}
<form method="POST" action="{{ url_for('main.addCov') }}">
  <label for="departure_location">Departure Location:</label>
  <input type="text" id="departure_location" name="departure_location" required>

  <label for="destination">Destination:</label>
  <input type="text" id="destination" name="destination" required>

  <label for="date">Date:</label>
  <input type="date" id="date" name="date" required> <!-- Generates a date in YYYY-MM-DD -->

  <label for="seats_available">Seats Available:</label>
  <input type="number" id="seats_available" name="seats_available" min="1" required>

  <button type="submit">Add Covoiturage</button>
</form>

{% endblock %}
